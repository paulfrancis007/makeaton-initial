name: brightloop

services:
  mailpit:
    # Official image pinned to the digest verified during local setup.
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
