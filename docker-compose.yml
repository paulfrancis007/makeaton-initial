services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brightloop_app} -d ${POSTGRES_DB:-brightloop_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: brightloop_postgres_data
